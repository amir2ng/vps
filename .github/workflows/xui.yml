name: Linux Cloud Server

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - name: 1. Update System
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y

      - name: 2. Install Basic Tools
        run: |
          sudo apt-get install -y \
            curl \
            wget \
            git \
            unzip \
            nano \
            htop \
            net-tools

      - name: 3. Install Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="github-linux-server"

          sleep 5

          TS_IP=$(sudo tailscale ip -4)

          echo "=================================================="
          echo "Tailscale IP: $TS_IP"
          echo "=================================================="

      - name: 4. Install 3x-ui
        run: |
          echo "Installing 3x-ui..."

          curl -fsSL https://raw.githubusercontent.com/mhsanaei/3x-ui/main/install.sh \
            | sudo bash

          echo "3x-ui installation completed."

          sudo systemctl enable x-ui
          sudo systemctl restart x-ui

          sleep 5

      - name: 5. Show 3x-ui Credentials
        run: |
          echo ""
          echo "=================================================="
          echo "          3x-ui PANEL INFORMATION"
          echo "=================================================="

          if [ -f /etc/x-ui/install-result.env ]; then
              sudo cat /etc/x-ui/install-result.env
          else
              echo "install-result.env not found."
              echo ""
              echo "Running x-ui settings:"
              sudo x-ui settings || true
          fi

          echo ""
          echo "=================================================="
          echo "          SERVICE STATUS"
          echo "=================================================="

          sudo systemctl status x-ui --no-pager || true

          echo ""
          echo "=================================================="
          echo "          TAILSCALE IP"
          echo "=================================================="

          sudo tailscale ip -4

      - name: 6. Keep Server Alive
        run: |
          for i in $(seq 1 360); do
            echo "[$i/360] Linux server running..."
            sleep 60
          done
