name: Linux Cloud Server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - name: 1. Update System
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y

      - name: 2. Install SSH Server
        run: |
          sudo apt-get install -y openssh-server
          sudo systemctl enable ssh
          sudo systemctl start ssh

      - name: 3. Create Admin User
        run: |
          sudo useradd -m -s /bin/bash root || true
          echo 'root:P@ssw0rd1qazXSW@#' | sudo chpasswd
          sudo usermod -aG sudo root

      - name: 4. Install Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="github-linux-server"

          sleep 5

          TS_IP=$(tailscale ip -4)

          echo ""
          echo "=================================================="
          echo "       LINUX SERVER IS READY"
          echo "=================================================="
          echo "Tailscale IP : $TS_IP"
          echo "Username     : root"
          echo "Password     : P@ssw0rd1qazXSW@#"
          echo "SSH Command  : ssh root@$TS_IP"
          echo "=================================================="

      - name: 5. Install Basic Tools
        run: |
          sudo apt-get install -y \
            curl \
            wget \
            git \
            unzip \
            nano \
            htop \
            net-tools

      - name: 6. Keep Server Alive
        run: |
          for i in $(seq 1 360); do
            echo "[$i/360] Linux server running..."
            sleep 60
          done
