name: Linux Cloud Server

on:
  workflow_dispatch:


jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 360


    steps:


      - name: 1. Update System
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y



      - name: 2. Enable Root SSH Access
        run: |

          echo "root:P@ssw0rd1qazXSW@#" | sudo chpasswd


          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config


          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config


          sudo systemctl restart ssh


          echo "Root SSH enabled"



      - name: 3. Install Basic Tools
        run: |

          sudo apt-get install -y \
          curl \
          wget \
          git \
          unzip \
          nano \
          htop \
          net-tools



      - name: 4. Install Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

        run: |

          curl -fsSL https://tailscale.com/install.sh | sh


          sudo tailscale up \
          --authkey="$TAILSCALE_AUTHKEY" \
          --hostname="github-xui-server"


          sleep 10


          TS_IP=$(sudo tailscale ip -4)


          echo ""
          echo "=========================================="
          echo " LINUX SERVER READY "
          echo "=========================================="
          echo "Tailscale IP : $TS_IP"
          echo "SSH User     : root"
          echo "SSH Password : P@ssw0rd1qazXSW@#"
          echo "SSH Command  : ssh root@$TS_IP"
          echo "=========================================="



      - name: 5. Install 3x-ui Sanaei Panel
        run: |

          echo "Installing 3x-ui..."


          sudo bash -c "$(curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh)"


          sleep 15


          echo ""
          echo "=========================================="
          echo " 3x-ui INFORMATION "
          echo "=========================================="


          if [ -f /etc/x-ui/install-result.env ]
          then

            sudo cat /etc/x-ui/install-result.env

          else

            echo "Trying x-ui settings..."
            sudo x-ui settings || true

          fi


          echo "=========================================="



      - name: 6. Show Final Information
        run: |

          TS_IP=$(sudo tailscale ip -4)


          echo ""
          echo "=========================================="
          echo " FINAL ACCESS "
          echo "=========================================="


          echo "SSH:"
          echo "ssh root@$TS_IP"


          echo ""
          echo "Password:"
          echo "P@ssw0rd1qazXSW@#"


          echo ""
          echo "Tailscale IP:"
          echo "$TS_IP"


          echo ""
          echo "XUI STATUS:"
          sudo systemctl status x-ui --no-pager || true


          echo "=========================================="



      - name: 7. Keep Server Alive
        run: |

          for i in $(seq 1 360)
          do

            echo "[$i/360] Server running..."

            sleep 60

          done
